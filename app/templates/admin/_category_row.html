<tr id="cat-row-{{ cat.id }}" class="border-t border-slate-100 hover:bg-slate-50/50">
  <td class="px-3 py-2 font-mono text-xs text-slate-500">{{ cat.category_id }}</td>
  <td class="px-3 py-2 font-medium text-slate-800">
    {{ cat.category_name }}
    {% if cat.is_adult %}
    <span class="ml-1.5 inline-block px-1.5 py-0.5 rounded bg-rose-100 text-rose-700 text-[10px] font-semibold tracking-wide">
      🔞 +18
    </span>
    {% endif %}
  </td>
  <td class="px-3 py-2">
    {% if cat.category_type == "vod" %}
      <span class="inline-block px-2 py-0.5 rounded bg-blue-100 text-blue-700 text-xs font-mono">VOD</span>
    {% elif cat.category_type == "series" %}
      <span class="inline-block px-2 py-0.5 rounded bg-purple-100 text-purple-700 text-xs font-mono">Série</span>
    {% else %}
      <span class="inline-block px-2 py-0.5 rounded bg-amber-100 text-amber-700 text-xs font-mono">Live</span>
    {% endif %}
  </td>
  <td class="px-3 py-2">
    {% if cat.is_allowed %}
      <span class="inline-block px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-xs">Autorisée</span>
    {% else %}
      <span class="inline-block px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs">Exclue</span>
    {% endif %}
  </td>
  <td class="px-3 py-2 text-right">
    <button hx-post="/admin/accounts/{{ cat.account_id }}/categories/{{ cat.category_id }}/toggle"
            hx-vals='{"category_type": "{{ cat.category_type }}"}'
            hx-target="#cat-row-{{ cat.id }}"
            hx-swap="outerHTML"
            class="px-2.5 py-1 text-xs font-medium rounded border transition-colors {% if cat.is_allowed %}bg-white border-red-300 text-red-600 hover:bg-red-50{% else %}bg-emerald-600 border-emerald-600 text-white hover:bg-emerald-700{% endif %}">
      {% if cat.is_allowed %}Bloquer{% else %}Autoriser{% endif %}
    </button>
  </td>
</tr>
