<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PlexHub Admin{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <style>
    .htmx-indicator { opacity: 0; transition: opacity 200ms; }
    .htmx-request .htmx-indicator,
    .htmx-request.htmx-indicator { opacity: 1; }
    [aria-busy="true"] { cursor: progress; }
  </style>
  <script>
    // Both listeners sit on `document` (htmx events and HX-Trigger events
    // bubble): this script runs in <head>, where `document.body` does not
    // exist yet.

    // The scrape drawer is a modal overlay: it opens centred on the viewport
    // wherever the operator clicked in the list, so picking a row at the
    // bottom of the page no longer means scrolling back to the top.
    window.plexhubScrape = (function () {
      function panel() { return document.getElementById('scrape-panel'); }

      // The open modal carries the identity of the row it was opened from.
      // `getElementById` is deliberate: a movie rating_key ends in `.mkv`,
      // which makes `#row-…-vod_439568.mkv` an INVALID CSS selector (the dot
      // parses as a class) — `querySelector` would throw. Same reason the
      // server-side `css_id` filter exists for hx-target attributes.
      function currentRow() {
        var modal = document.getElementById('scrape-modal');
        if (!modal) { return null; }
        return document.getElementById(
          'row-' + modal.dataset.sid + '-' + modal.dataset.rk
        );
      }

      function close() {
        var p = panel();
        if (p) { p.innerHTML = ''; }
        document.body.classList.remove('overflow-hidden');
      }

      function open(url) {
        htmx.ajax('GET', url, { target: '#scrape-panel', swap: 'innerHTML' });
      }

      // Chain to the next unresolved item of the current page, so a queue
      // can be worked through without touching the list between two medias.
      // `?auto=1` makes the drawer fire its candidate search on load.
      function next() {
        var row = currentRow();
        close();
        // Opened from the review list rather than the table: nothing to
        // chain through, stop here instead of jumping somewhere unrelated.
        if (!row || !row.dataset.scrapeUrl) { return false; }
        var rows = Array.prototype.slice.call(
          document.querySelectorAll('#media-table tbody tr[data-scrape-url]')
        );
        for (var i = rows.indexOf(row) + 1; i < rows.length; i++) {
          if (rows[i].dataset.incomplete === '1') {
            rows[i].scrollIntoView({ block: 'center' });
            open(rows[i].dataset.scrapeUrl + '?auto=1');
            return true;
          }
        }
        return false;
      }

      return { close: close, next: next, open: open };
    })();

    // A successful apply closes the scrape drawer. The event fires on the
    // row's own form, which is NOT an ancestor of #scrape-panel — hence a
    // document-level listener rather than an attribute on the panel.
    // It fires BEFORE the row swap, so the row read here is still the old
    // one — harmless, since chaining skips it by position either way.
    document.addEventListener('close-scrape-panel', function () {
      window.plexhubScrape.next();
    });

    document.addEventListener('keydown', function (evt) {
      if (evt.key === 'Escape') { window.plexhubScrape.close(); }
    });

    // Freeze the page behind the overlay, and thaw it when the panel empties.
    document.addEventListener('htmx:afterSwap', function (evt) {
      if (evt.target && evt.target.id === 'scrape-panel') {
        document.body.classList.toggle(
          'overflow-hidden', evt.target.innerHTML.trim() !== ''
        );
      }
    });

    // Listener on `document` (htmx events bubble): this script runs in
    // <head>, where `document.body` does not exist yet.
    // htmx 1.x drops 4xx responses on the floor (no swap). Every admin error
    // path (409 conflict / locked, 422 validation) answers with the SAME
    // fragment the success path returns, carrying the message the operator
    // must read — without this, clicking Appliquer on a conflict changes
    // nothing on screen and looks like a dead button. Only these two codes
    // are opted in; a 500 keeps htmx's default silence.
    document.addEventListener('htmx:beforeSwap', function (evt) {
      var code = evt.detail.xhr.status;
      if (code === 409 || code === 422) {
        evt.detail.shouldSwap = true;
        evt.detail.isError = false;
      }
    });
  </script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="bg-slate-900 text-slate-100 shadow">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-baseline gap-4">
      <h1 class="text-lg font-semibold">PlexHub — Admin films</h1>
      <span class="text-xs text-slate-400">Édition manuelle des IMDb / TMDB IDs</span>
      <nav class="ml-auto flex items-center gap-3 text-sm">
        <a href="/admin" class="text-slate-300 hover:text-white">Catalogue</a>
        <a href="/admin/import-nfo" class="text-slate-300 hover:text-white">Importer NFO</a>
        <a href="/admin/downloads" class="text-slate-300 hover:text-white">Télécharger</a>
        <a href="/admin/plex-downloads" class="text-slate-300 hover:text-white">Télécharger Plex</a>
        <a href="/admin/unified-downloads" class="text-slate-300 hover:text-white">Téléchargements</a>
        <a href="/admin/keys" class="text-slate-300 hover:text-white">Clés API</a>
      </nav>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
