{% if error %}
<div class="p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded">
  <strong>Erreur :</strong> {{ error }}
</div>
{% else %}
<div class="p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm rounded flex items-center justify-between">
  <div>
    <strong>Compte ajouté avec succès !</strong>
    <span class="ml-2 font-mono text-xs text-emerald-900">{{ label }} (ID: {{ account_id }})</span>
  </div>
</div>
{% endif %}
