services:
  backend:
    build: .
    container_name: plexhub-backend
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    # AUDIT-P7-006 : le bloc `environment:` seul n'injectait qu'un sous-ensemble
    # des clés lues par app/config.py (~20 manquantes : AI_API_KEY,
    # ADMIN_USERNAME/ADMIN_PASSWORD, TV_AUTH_ENCRYPTION_KEY,
    # XTREAM_ENCRYPTION_KEY, CORS_ORIGINS, OLLAMA_*, PLEX_ACCOUNT_TOKEN,
    # TMDB_LANGUAGE, BACKUP_*, DATA_DIR/LOG_DIR, AI_EMBED_*, ADULT_*,
    # XTREAM_USER_AGENT, ...) et le `.env` hôte n'entrait jamais dans le
    # conteneur (le Dockerfile ne copie que app/, et rien ne le monte) :
    # `docker compose up` livré donnait 100 % de l'API en 401 et
    # l'admin/docs en 503.
    #
    # `env_file: .env` couvre toute la surface présente ET future en une
    # seule ligne (`required: false` : absence de `.env` = pas d'erreur de
    # config, mais AUCUNE valeur permissive par défaut n'est injectée ici —
    # ADMIN_PASSWORD/AI_API_KEY restent vides côté app.config, donc le
    # comportement fail-closed est préservé : /admin reste 503, /api/* reste
    # 401). Copier `.env.example` vers `.env` (jamais commité, voir
    # .gitignore) pour peupler ces clés.
    #
    # S4.1 (AUDIT-P2-001/CR-S02) : /metrics est désormais authentifié par
    # défaut (METRICS_USERNAME/METRICS_PASSWORD, déjà couverts par
    # `env_file: .env` ci-dessous comme le reste — rien à ajouter dans le
    # bloc `environment:` figé). METRICS_PASSWORD vide ⇒ /metrics répond 503
    # fail-closed ; reconfigurer la job Prometheus en `basic_auth:` avant de
    # déployer (voir docs/plans/2026-07-26-refacto-audit-v1-plan.md §7.1).
    #
    # PRÉCÉDENCE : Compose applique `environment:` APRÈS `env_file:`, donc le
    # bloc `environment:` ci-dessous gagne toujours sur `.env`. On l'utilise
    # donc uniquement pour les valeurs qui DOIVENT rester verrouillées au
    # chemin conteneur (PLEX_LIBRARY_DIR/DOWNLOAD_DIR : un `.env` hôte ne
    # doit jamais pouvoir les faire pointer ailleurs que sur les volumes
    # montés plus bas) et pour APP_PORT/TZ (déjà interpolés dans ce fichier
    # via `${...}`, donc réaffirmés ici pour cohérence avec `ports:`
    # ci-dessus).
    env_file:
      - path: .env
        required: false
    environment:
      - APP_PORT=${APP_PORT:-8000}
      - PLEX_LIBRARY_DIR=/app/media
      # Téléchargement physique de médias (onglet admin « Télécharger ») :
      # chemin FIXE dans le conteneur (comme PLEX_LIBRARY_DIR). Le dossier
      # hôte correspondant se règle via DOWNLOAD_HOST_PATH (volume ci-dessous).
      - DOWNLOAD_DIR=/app/downloads
      - TZ=${TZ:-UTC}
    # AUDIT-P7-007 (S6.1) : l'image tourne désormais en utilisateur non-root
    # UID:GID 1000:1000 (voir Dockerfile). Ces 4 volumes hôtes doivent être
    # accessibles en écriture par 1000:1000 AVANT le premier
    # `docker compose up` avec cette image, sinon le boot échoue à `init_db`
    # (SQLite/WAL + verrou d'élection master `fcntl.flock`) ou dégrade en
    # esclave silencieux (AUDIT-P1-003) :
    #   chown -R 1000:1000 ./data ./logs ./media ./downloads
    # (adapter les 2 derniers chemins si PLEX_MEDIA_HOST_PATH/
    # DOWNLOAD_HOST_PATH sont surchargés). Détail + procédure de migration
    # d'un déploiement existant : docs/32-ops-docker-nonroot.md.
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ${PLEX_MEDIA_HOST_PATH:-./media}:/app/media
      - ${DOWNLOAD_HOST_PATH:-./downloads}:/app/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${APP_PORT:-8000}/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

